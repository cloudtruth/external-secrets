apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: payments-production
spec:
  provider:
    sigmaconfig:
      server: https://api.cloudtruth.io  # optional, this is the default
      project: payments-api               # project name, matched exactly
      environment: production             # optional, default "default"
      tag: release-2026-10                # optional; pins every read to this tag
      auth:
        apiKeySecretRef:
          name: sigma-config-api-key
          key: api-key
