apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-env
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: payments-production
    kind: SecretStore
  target:
    name: payments-env
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db_password          # parameter name
    - secretKey: STRIPE_KEY
      remoteRef:
        key: stripe               # parameter whose value is a JSON object
        property: secret_key      # field inside that JSON
    - secretKey: FEATURE_FLAGS
      remoteRef:
        key: feature_flags
        version: release-2026-09  # tag for this key only; overrides the store tag
